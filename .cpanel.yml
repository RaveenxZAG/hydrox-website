---
deployment:
  tasks:
    - /bin/chmod -R 775 storage bootstrap/cache
    - '/bin/bash -lc "if command -v composer >/dev/null 2>&1; then composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction; elif [ -x /opt/cpanel/composer/bin/composer ]; then /opt/cpanel/composer/bin/composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction; else echo Composer is not available on this hosting account; exit 1; fi"'
    - '/bin/bash -lc "if [ ! -f .env ]; then echo Create the project .env file in cPanel File Manager before deployment; exit 1; fi"'
    - /bin/bash -lc "php artisan migrate --force"
    - /bin/bash -lc "php artisan storage:link || true"
    - /bin/bash -lc "php artisan optimize"
